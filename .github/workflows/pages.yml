name: Auf GitHub Pages veröffentlichen

on:
  push:
    # Der Feature-Branch deployt mit, solange der PR offen ist;
    # nach dem Merge liefert jeder Push auf main die neueste Version.
    branches: [ "main", "claude/carcassonne-mobile-app-aju8y1" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
