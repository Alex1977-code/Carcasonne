name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  engine-tests:
    name: Engine-Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Alle Suiten
        # Nicht einzeln aufzaehlen. Vorher stand hier eine Liste, und
        # tests/qr.test.mjs fehlte darin – der Encoder lief zwei Commits
        # lang ungeprueft durch die CI. Was im Ordner liegt, wird gelaufen.
        run: |
          set -e
          gefunden=0
          for t in tests/*.test.mjs; do
            echo "=== $t"
            node "$t"
            gefunden=$((gefunden + 1))
          done
          if [ "$gefunden" -lt 5 ]; then
            echo "Nur $gefunden Suiten gefunden – da fehlt etwas." >&2
            exit 1
          fi
          echo "$gefunden Suiten gelaufen."
