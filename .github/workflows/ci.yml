name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  engine-tests:
    name: Engine-Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine-Tests
        run: node tests/engine.test.mjs
      - name: Kachelschema (Renderer-Adapter)
        run: node tests/tiles-schema.test.mjs
